[package]
name = "dreamerv3"
version = "0.1.0"
edition = "2021"
description = "DreamerV3: Mastering Diverse Domains through World Models - Rust/Burn implementation"
license = "MIT"

[dependencies]
burn = { version = "0.16", features = ["train", "wgpu", "ndarray"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = true
